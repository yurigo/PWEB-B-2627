<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a href="/">volver al inicio</a>
    <p>Este ejemplo muestra la diferencia entre un div y un button</p>
    <div
      style="background-color: lightgreen; padding: 10px; display: inline-block"
      onclick="alert('Div clicked!')"
    >
      Este es un div que actúa como un botón
    </div>
    <button
      style="background-color: lightgreen; padding: 10px"
      onclick="alert('Button clicked!')"
    >
      Este es un botón
    </button>

    <button
      style="background-color: lightgreen; padding: 10px"
      disabled
      onclick="alert('Button clicked!')"
    >
      Este es un botón
    </button>
  </body>
</html>
